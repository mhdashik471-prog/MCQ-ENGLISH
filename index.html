<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Language Skills for Humanities and Other BA Programmes ( ENGIFA101 )</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
      --success-bg: #dcfce7;
      --error: #b91c1c;
      --error-bg: #fee2e2;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    /* Login Screen */
    #login-section {
      text-align: center;
      padding: 40px 20px;
      max-width: 540px;
      margin: 60px auto;
    }

    #login-section h1 {
      font-size: 1.45rem;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .btn-outline:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .btn-submit-exam {
      background: var(--success);
      color: #fff;
      font-size: 1.1rem;
      padding: 14px 28px;
      margin: 30px auto;
      display: block;
      width: 100%;
      max-width: 320px;
    }

    .btn-submit-exam:hover {
      background: #166534;
    }

    /* Header */
    .exam-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .exam-header h2 {
      font-size: 1.25rem;
      color: var(--primary);
    }

    .user-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Question Cards */
    .q-number {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .q-text {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-label {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #fafafa;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      user-select: none;
    }

    .option-label:hover:not(.locked) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .option-label input[type="radio"] {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .option-label.locked {
      cursor: default;
    }

    .option-label.correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #14532d !important;
      font-weight: 600;
    }

    .option-label.incorrect {
      background-color: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: #7f1d1d !important;
      font-weight: 600;
    }

    /* In-card interactive section */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .hint-container, .malayalam-container {
      font-size: 0.9rem;
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }

    .hint-container {
      background: #fef9c3;
      color: #713f12;
      border-left: 4px solid #eab308;
    }

    .ml-text {
      color: #0369a1;
      font-weight: 500;
      margin-left: 6px;
    }

    .status-badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      margin-top: 6px;
    }

    .status-correct {
      background: var(--success-bg);
      color: var(--success);
    }

    .status-incorrect {
      background: var(--error-bg);
      color: var(--error);
    }

    /* Scorecard */
    .scorecard {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      border: 2px solid var(--accent);
      margin-bottom: 24px;
    }

    .scorecard h3 {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 16px;
      text-align: center;
    }

    .scorecard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .score-item {
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .score-item .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .score-item .val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 4px;
    }

    .performance-note {
      padding: 14px 18px;
      background: #eff6ff;
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      color: #1e40af;
      font-size: 0.95rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background: #fff;
      padding: 28px;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-box h3 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .modal-box p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .modal-actions .btn {
      width: auto;
      flex: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- LOGIN SCREEN -->
    <section id="login-section" class="card">
      <h1>English Language Skills for Humanities and Other BA Programmes ( ENGIFA101 )</h1>
      
      <div class="form-group">
        <label for="student-name">Student Full Name</label>
        <input type="text" id="student-name" class="form-control" placeholder="Enter your full name" required>
      </div>
      
      <button id="btn-start" class="btn btn-primary">Start Examination</button>
    </section>

    <!-- EXAM CONTAINER -->
    <main id="exam-section" class="hidden">
      <!-- HEADER -->
      <div class="exam-header card">
        <div>
          <h2>English Language Skills ( ENGIFA101 )</h2>
          <span style="font-size: 0.85rem; color: var(--text-muted);">Modules 1 - 4 Comprehensive Examination</span>
        </div>
        <div class="user-badge" id="student-badge">Student</div>
      </div>

      <!-- TOP SCORECARD PLACEHOLDER -->
      <div id="top-scorecard-container"></div>

      <!-- QUESTIONS LIST -->
      <div id="questions-list"></div>

      <!-- SUBMIT BUTTON -->
      <button id="btn-submit" class="btn btn-submit-exam">Submit Examination</button>

      <!-- BOTTOM SCORECARD PLACEHOLDER -->
      <div id="bottom-scorecard-container"></div>
    </main>
  </div>

  <!-- CONFIRMATION MODAL -->
  <div id="confirm-modal" class="modal-backdrop">
    <div class="modal-box">
      <h3>Unanswered Questions Remaining</h3>
      <p id="unanswered-count-text">You have skipped 0 questions. Are you sure you want to finish?</p>
      <div class="modal-actions">
        <button id="btn-modal-review" class="btn btn-outline">Review Questions</button>
        <button id="btn-modal-proceed" class="btn btn-primary" style="background: var(--error);">Proceed & Submit</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. QUESTION DATABASE (ALL 121 QUESTIONS IN EXACT ORDER) ---
    const questionsData = [
      {
        q: "Where did Martin Luther King Jr. deliver the 'I Have a Dream' speech?",
        q_ml: "മാർട്ടിൻ ലൂഥർ കിംഗ് ജൂനിയർ 'എനിക്കൊരു സ്വപ്നമുണ്ട്' എന്ന പ്രസംഗം എവിടെ വെച്ചാണ് നടത്തിയത്?",
        options: [
          { text: "Montgomery, Alabama", ml: "മോണ്ട്ഗോമറി, അലബാമ" },
          { text: "Washington, D.C.", ml: "വാഷിംഗ്ടൺ ഡി.സി." },
          { text: "Atlanta, Georgia", ml: "അറ്റ്ലാന്റ, ജോർജിയ" },
          { text: "Chicago, Illinois", ml: "ചിക്കാഗോ, ഇല്ലിനോയിസ്" }
        ],
        ans: 1,
        hint: "Delivered at the Lincoln Memorial during the March on Washington in 1963.",
        hint_ml: "1963-ൽ വാഷിംഗ്ടൺ മാർച്ചിനിടെ ലിങ്കൺ മെമ്മോറിയലിൽ വെച്ചാണ് ഇത് അവതരിപ്പിച്ചത്."
      },
      {
        q: "What major theme does King emphasize in his 'dream'?",
        q_ml: "തന്റെ 'സ്വപ്നത്തിൽ' കിംഗ് ഊന്നിപ്പറയുന്ന പ്രധാന പ്രമേയം എന്താണ്?",
        options: [
          { text: "Economic prosperity for all Americans", ml: "എല്ലാ അമേരിക്കക്കാർക്കും സാമ്പത്തിക അഭിവൃദ്ധി" },
          { text: "A world without any political conflict", ml: "യാതൊരു രാഷ്ട്രീയ സംഘർഷവുമില്ലാത്ത ഒരു ലോകം" },
          { text: "Racial equality and harmony", ml: "വംശീയ സമത്വവും ഐക്യവും" },
          { text: "The expansion of American territory", ml: "അമേരിക്കൻ അതിർത്തി വികസനം" }
        ],
        ans: 2,
        hint: "He envisioned an integrated society free from racial prejudice.",
        hint_ml: "വംശീയ മുൻവിധിയില്ലാത്ത ഒരു സമൂഹമാണ് അദ്ദേഹം സ്വപ്നം കണ്ടത്."
      },
      {
        q: "Which rhetorical device is most famously used throughout the speech?",
        q_ml: "പ്രസംഗത്തിലുടനീളം ഏറ്റവും പ്രശസ്തമായി ഉപയോഗിച്ചിട്ടുള്ള ഭാഷാ പ്രയോഗം (rhetorical device) ഏതാണ്?",
        options: [
          { text: "Irony", ml: "വിരോധാഭാസം (Irony)" },
          { text: "Repetition", ml: "ആവർത്തനം (Repetition)" },
          { text: "Hyperbole", ml: "അതിശയോക്തി (Hyperbole)" },
          { text: "Alliteration", ml: "അനുപ്രാസം (Alliteration)" }
        ],
        ans: 1,
        hint: "Phrases like 'I have a dream' and 'Let freedom ring' recur repeatedly.",
        hint_ml: "'എനിക്കൊരു സ്വപ്നമുണ്ട്' തുടങ്ങിയ വാചകങ്ങൾ നിരന്തരം ആവർത്തിക്കുന്നു."
      },
      {
        q: "King refers to the Declaration of Independence to emphasize which idea?",
        q_ml: "ഏത് ആശയം ഊന്നിപ്പറയാനാണ് കിംഗ് സ്വാതന്ത്ര്യ പ്രഖ്യാപനത്തെ പരാമർശിക്കുന്നത്?",
        options: [
          { text: "America should become a monarchy", ml: "അമേരിക്ക ഒരു രാജഭരണമായി മാറണം" },
          { text: "All citizens must follow strict laws", ml: "എല്ലാ പൗരന്മാരും കർശനമായ നിയമങ്ങൾ പാലിക്കണം" },
          { text: "The promise of equal rights for all", ml: "എല്ലാവർക്കും തുല്യാവകാശം എന്ന വാഗ്ദാനം" },
          { text: "The need for more economic reforms", ml: "കൂടുതൽ സാമ്പത്തിക പരിഷ്കാരങ്ങളുടെ ആവശ്യം" }
        ],
        ans: 2,
        hint: "The founding document stated that all men are created equal.",
        hint_ml: "എല്ലാ മനുഷ്യരും തുല്യരായി സൃഷ്ടിക്കപ്പെട്ടിരിക്കുന്നു എന്ന് സ്ഥാപക രേഖയിൽ വ്യക്തമാക്കിയിട്ടുണ്ട്."
      },
      {
        q: "According to the speech, what should people be judged by?",
        q_ml: "പ്രസംഗമനുസരിച്ച്, ആളുകളെ എന്തിന്റെ അടിസ്ഥാനത്തിലാണ് വിലയിരുത്തേണ്ടത്?",

          { text: "The content of their character", ml: "അവരുടെ സ്വഭാവഗുണം (ഗുണവിശേഷങ്ങൾ)" },
          { text: "Their political views", ml: "അവരുടെ രാഷ്ട്രീയ വീക്ഷണങ്ങൾ" }
        ],
        ans: 2,
        hint: "Not by the color of their skin, but by who they are internally.",
        hint_ml: "തൊലിയുടെ നിറത്തിനാലല്ല, അവരുടെ ഉള്ളിലെ ഗുണങ്ങളാലാണ്."
      },
      {
        q: "What is the primary effect of King's use of 'we' throughout the speech?",
        q_ml: "പ്രസംഗത്തിലുടനീളം കിംഗ് 'നാം' (we) എന്ന് ഉപയോഗിക്കുന്നതിന്റെ പ്രധാന പ്രഭാവം എന്താണ്?",
        options: [
          { text: "To highlight King's authority as a leader", ml: "ഒരു നേതാവെന്ന നിലയിൽ കിംഗിന്റെ അധികാരം ഉയർത്തിക്കാട്ടാൻ" },
          { text: "To reduce the seriousness of the occasion", ml: "സന്ദർഭത്തിന്റെ ഗൗരവം കുറയ്ക്കാൻ" },
          { text: "To create a sense of unity and inclusion", ml: "ഐക്യത്തിന്റെയും പങ്കാളിത്തത്തിന്റെയും വികാരം സൃഷ്ടിക്കാൻ" },
          { text: "To criticize the audience", ml: "ശ്രോതാക്കളെ വിമർശിക്കാൻ" }
        ],
        ans: 2,
        hint: "First-person plural fosters a collective, shared struggle.",
        hint_ml: "കൂട്ടായ പോരാട്ടത്തിന്റെ വികാരമാണ് ഈ പദം ഉണ്ടാക്കുന്നത്."
      },
      {
        q: "Which historical document or speech is referenced by King when he opens with 'Five score years ago'?",

        options: [
          { text: "Thomas Paine's Common Sense", ml: "തോമസ് പെയ്ന്റെ കോമൺ സെൻസ്" },
          { text: "Abraham Lincoln's Gettysburg Address", ml: "എബ്രഹാം ലിങ്കന്റെ ഗെറ്റിസ്ബർഗ് പ്രസംഗം" },
          { text: "George Washington's Farewell Address", ml: "ജോർജ്ജ് വാഷിംഗ്ടന്റെ വിടവാങ്ങൽ പ്രസംഗം" },
          { text: "Franklin Roosevelt's Inaugural Address", ml: "ഫ്രാങ്ക്ലിൻ റൂസ്‌വെൽറ്റിന്റെ സ്ഥാനാരോഹണ പ്രസംഗം" }
        ],
        ans: 1,
        hint: "Lincoln opened his famous 1863 address with 'Four score and seven years ago'.",
        hint_ml: "ലിങ്കൺ തന്റെ പ്രസംഗം ആരംഭിച്ചത് സമാനമായ വാക്കുകളോടെയാണ്."
      },
      {
        q: "Which literary or rhetorical device is used when King refers to another historical text or speech?",

    let studentName = "";

    let startTime = null;
    let endTime = null;
    let userAnswers = {}; // { qIndex: selectedOptionIndex }
    let isSubmitted = false;

    const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbw6IXYRG6MiU8g6TJQu5H1H7jdtAPjy3_9j5FT5uJSpRIoQwGM9aIVQs7-XFTX05Alclw/exec";

    // --- 3. DOM ELEMENTS ---
    const loginSection = document.getElementById("login-section");
    const examSection = document.getElementById("exam-section");
    const studentNameInput = document.getElementById("student-name");
    const btnStart = document.getElementById("btn-start");
    const studentBadge = document.getElementById("student-badge");
    const questionsList = document.getElementById("questions-list");
    const btnSubmit = document.getElementById("btn-submit");
    const topScorecardContainer = document.getElementById("top-scorecard-container");
    const bottomScorecardContainer = document.getElementById("bottom-scorecard-container");

    const confirmModal = document.getElementById("confirm-modal");
    const unansweredCountText = document.getElementById("unanswered-count-text");
    const btnModalReview = document.getElementById("btn-modal-review");
    const btnModalProceed = document.getElementById("btn-modal-proceed");

    // Initialize date silently for payload logging
    const now = new Date();
    examDate = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

    // --- 4. START EXAM ---
    btnStart.addEventListener("click", () => {
      const name = studentNameInput.value.trim();
      if (!name) {
        alert("Please enter your full name to proceed with the examination.");
        studentNameInput.focus();
        return;
      }
      studentName = name;
      studentBadge.textContent = "Student: " + studentName;

      loginSection.classList.add("hidden");
      examSection.classList.remove("hidden");
      startTime = new Date();

      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // --- 5. RENDER QUESTIONS ---
    function renderQuestions() {
      questionsList.innerHTML = "";
      questionsData.forEach((qData, qIndex) => {
        const card = document.createElement("div");
        card.className = "card question-card";
        card.id = `q-card-${qIndex}`;

        // Options HTML
        let optionsHtml = "";
        qData.options.forEach((opt, optIndex) => {
          optionsHtml += `
            <label class="option-label" id="opt-label-${qIndex}-${optIndex}">
              <input type="radio" name="question-${qIndex}" value="${optIndex}" onchange="handleOptionSelect(${qIndex}, ${optIndex})">
              <span class="opt-text">${String.fromCharCode(65 + optIndex)}. ${opt.text}</span>
              <span class="ml-text hidden opt-ml-text" id="opt-ml-${qIndex}-${optIndex}">[ ${opt.ml} ]</span>
            </label>
          `;
        });

        card.innerHTML = `
          <div class="q-number">Question ${qIndex + 1} of ${questionsData.length}</div>
          <div class="q-text">
            <span>${qData.q}</span>
            <span class="ml-text hidden q-ml-text" id="q-ml-${qIndex}">[ ${qData.q_ml} ]</span>
          </div>

          <div class="options-grid" id="options-group-${qIndex}">
            ${optionsHtml}
          </div>

          <div class="card-actions">
            <button type="button" class="btn btn-outline" onclick="toggleHint(${qIndex})">Hint</button>
            <button type="button" class="btn btn-outline" onclick="toggleMalayalam(${qIndex})">Malayalam</button>
          </div>

          <div class="hint-container" id="hint-box-${qIndex}">
            <strong>Clue:</strong> ${qData.hint}
            <span class="ml-text hidden hint-ml-text" id="hint-ml-${qIndex}"><br>[ ${qData.hint_ml} ]</span>
          </div>

          <div id="status-badge-${qIndex}"></div>
        `;

        questionsList.appendChild(card);
      });
    }

    // --- 6. OPTION SELECTION & LOCKING ---
    window.handleOptionSelect = function(qIndex, selectedOptIndex) {
      if (userAnswers.hasOwnProperty(qIndex) || isSubmitted) return;

      userAnswers[qIndex] = selectedOptIndex;
      const qData = questionsData[qIndex];
      const isCorrect = (selectedOptIndex === qData.ans);

      // Lock all options for this question
      const group = document.getElementById(`options-group-${qIndex}`);
      const radios = group.querySelectorAll('input[type="radio"]');
      radios.forEach(r => r.disabled = true);

      const labels = group.querySelectorAll('.option-label');
      labels.forEach(l => l.classList.add('locked'));

      // Highlight selected
      const selectedLabel = document.getElementById(`opt-label-${qIndex}-${selectedOptIndex}`);
      if (isCorrect) {
        selectedLabel.classList.add("correct");
      } else {
        selectedLabel.classList.add("incorrect");
        // Highlight correct option
        const correctLabel = document.getElementById(`opt-label-${qIndex}-${qData.ans}`);
        if (correctLabel) {
          correctLabel.classList.add("correct");
        }
      }

      // Display Status Badge
      const statusContainer = document.getElementById(`status-badge-${qIndex}`);
      if (isCorrect) {
        statusContainer.innerHTML = `<span class="status-badge status-correct">✓ Correct Answer</span>`;
      } else {
        statusContainer.innerHTML = `<span class="status-badge status-incorrect">✕ Incorrect Answer</span>`;
      }
    };

    // --- 7. HINT & MALAYALAM TOGGLES ---
    window.toggleHint = function(qIndex) {
      const hintBox = document.getElementById(`hint-box-${qIndex}`);
      if (hintBox.style.display === "block") {
        hintBox.style.display = "none";
      } else {
        hintBox.style.display = "block";
      }
    };

    window.toggleMalayalam = function(qIndex) {
      const qMl = document.getElementById(`q-ml-${qIndex}`);
      const isShowing = !qMl.classList.contains("hidden");

      if (isShowing) {
        qMl.classList.add("hidden");
        document.getElementById(`hint-ml-${qIndex}`).classList.add("hidden");
        questionsData[qIndex].options.forEach((_, optIndex) => {
          document.getElementById(`opt-ml-${qIndex}-${optIndex}`).classList.add("hidden");
        });
      } else {
        qMl.classList.remove("hidden");
        document.getElementById(`hint-ml-${qIndex}`).classList.remove("hidden");
        questionsData[qIndex].options.forEach((_, optIndex) => {
          document.getElementById(`opt-ml-${qIndex}-${optIndex}`).classList.remove("hidden");
        });
      }
    };

    // --- 8. SUBMISSION LOGIC & MODAL ---
    btnSubmit.addEventListener("click", () => {
      if (isSubmitted) return;

      const total = questionsData.length;
      const attended = Object.keys(userAnswers).length;
      const unattended = total - attended;

      if (unattended > 0) {
        unansweredCountText.textContent = `You have skipped ${unattended} question${unattended > 1 ? 's' : ''}. Unanswered questions will be marked as incorrect. Are you sure you want to proceed?`;
        confirmModal.style.display = "flex";
      } else {
        finalizeExam();
      }
    });

    btnModalReview.addEventListener("click", () => {
      confirmModal.style.display = "none";
    });

    btnModalProceed.addEventListener("click", () => {
      confirmModal.style.display = "none";
      finalizeExam();
    });

    // --- 9. FINALIZE & CALCULATE SCORE ---
    function finalizeExam() {
      if (isSubmitted) return;
      isSubmitted = true;
      endTime = new Date();

      btnSubmit.style.display = "none";

      let score = 0;
      const total = questionsData.length;
      const attended = Object.keys(userAnswers).length;
      const unattended = total - attended;

      questionsData.forEach((qData, qIndex) => {
        const userChoice = userAnswers[qIndex];
        if (userChoice !== undefined) {
          if (userChoice === qData.ans) {
            score++;
          }
        } else {
          // Unattended question: Lock and reveal correct answer in green
          const group = document.getElementById(`options-group-${qIndex}`);
          const radios = group.querySelectorAll('input[type="radio"]');
          radios.forEach(r => r.disabled = true);
          const labels = group.querySelectorAll('.option-label');
          labels.forEach(l => l.classList.add('locked'));

          const correctLabel = document.getElementById(`opt-label-${qIndex}-${qData.ans}`);
          if (correctLabel) {
            correctLabel.classList.add("correct");
          }

          const statusContainer = document.getElementById(`status-badge-${qIndex}`);
          statusContainer.innerHTML = `<span class="status-badge status-incorrect">Unanswered (Correct Revealed)</span>`;
        }
      });

      const percentage = Math.round((score / total) * 100);
      let grade = "F";
      if (percentage >= 90) grade = "A+";
      else if (percentage >= 80) grade = "A";
      else if (percentage >= 70) grade = "B";
      else if (percentage >= 60) grade = "C";
      else if (percentage >= 50) grade = "D";

      // Time calculation (Calculated and passed to Google Sheet silently)
      const timeDiffSec = Math.floor((endTime - startTime) / 1000);
      const minutes = Math.floor(timeDiffSec / 60);
      const seconds = timeDiffSec % 60;
      const timeTakenStr = `${minutes}m ${seconds}s`;

      // Performance motivational note
      let performanceNote = "";
      if (percentage >= 85) {
        performanceNote = "Exceptional performance! You have demonstrated thorough mastery of the literary texts, analytical devices, and historical contexts across all modules.";
      } else if (percentage >= 70) {
        performanceNote = "Well done! You show a strong understanding of the themes and communication principles. Review the missed questions to reinforce key concepts.";
      } else if (percentage >= 50) {
        performanceNote = "Good effort! You have cleared the core criteria. Dedicated revision of specific literary devices and text analyses will significantly enhance your grasp.";
      } else {
        performanceNote = "Don't be discouraged! Take time to re-read the prescribed literary selections and review the analytical hints provided for each question.";
      }

      // Student Scorecard HTML (Exam Date and Time Taken removed from UI)
      const scorecardHtml = `
        <div class="scorecard">
          <h3>Official Examination Scorecard</h3>
          <div class="scorecard-grid">
            <div class="score-item"><div class="label">Candidate Name</div><div class="val" style="font-size:1.05rem;">${studentName}</div></div>
            <div class="score-item"><div class="label">Subject</div><div class="val" style="font-size:0.95rem;">ENGIFA101</div></div>
            <div class="score-item"><div class="label">Total Questions</div><div class="val">${total}</div></div>
            <div class="score-item"><div class="label">Attended</div><div class="val">${attended}</div></div>
            <div class="score-item"><div class="label">Unattended</div><div class="val">${unattended}</div></div>
            <div class="score-item"><div class="label">Final Score</div><div class="val" style="color:var(--accent);">${score} / ${total}</div></div>
            <div class="score-item"><div class="label">Percentage</div><div class="val">${percentage}%</div></div>
            <div class="score-item"><div class="label">Awarded Grade</div><div class="val" style="color:var(--primary);">${grade}</div></div>
          </div>
          <div class="performance-note">
            <strong>Performance Assessment:</strong> ${performanceNote}
          </div>
        </div>
      `;

      topScorecardContainer.innerHTML = scorecardHtml;
      bottomScorecardContainer.innerHTML = scorecardHtml;

      window.scrollTo({ top: 0, behavior: 'smooth' });

      // --- 10. SILENT GOOGLE SHEETS BACKGROUND SYNC ---
      // Both date and timeTaken remain intact in payload
      const payload = {
        timestamp: new Date().toISOString(),
        name: studentName,
        subject: "English Language Skills for Humanities and Other BA Programmes ( ENGIFA101 )",
        date: examDate,
        timeTaken: timeTakenStr,
        total: total,
        attended: attended,
        unattended: unattended,
        score: score,
        percentage: percentage + "%",
        grade: grade
      };

      try {
        fetch(GOOGLE_SHEET_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            timestamp: payload.timestamp,
            name: payload.name,
            subject: payload.subject,
            date: payload.date,
            timeTaken: payload.timeTaken,
            total: payload.total,
            attended: payload.attended,
            unattended: payload.unattended,
            score: payload.score,
            percentage: payload.percentage,
            grade: payload.grade
          })
        }).catch(() => {});
      } catch (err) {
        // Fail silently
      }
    }
  </script>
</body>
</html>
